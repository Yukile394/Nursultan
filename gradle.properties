org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# jar'daki fabric.mod.json'dan okundu
mod_version=1.21.11
maven_group=fun.nursultan
archives_base_name=nursultan

minecraft_version=1.21.11
# yarn_mappings: TAHMIN, jar'dan okunamadi (mapping dosyasi gomulu degil).
# decompile.py Fabric Meta API'den MC 1.21.11 icin GUNCEL yarn build'ini cekip
# DECOMPILE_REPORT.md'ye yazar. Bootstrap calistiktan sonra oradaki surumle
# asagidaki satiri eslestir, yoksa build.gradle'daki mapping cagrisi decompile.py'nin
# kullandigindan farkli bir yarn build'i cekebilir ve isimler tutmaz.
yarn_mappings=1.21.11+build.1
# loader_version: jar'daki fabric.mod.json "depends.fabricloader": ">=0.14.0" -
# bu bir ALT SINIR, tam surum degil. 0.16.10 TAHMIN (1.21.11 ile uyumlu bilinen en yeni).
loader_version=0.16.10
# fabric_version (Fabric API): jar MANIFEST'inde veya mod.json'da gecmiyor, TAHMIN.
# Build hata verirse https://fabricmc.net/develop/ adresinden MC 1.21.11 icin
# dogru Fabric API surumunu bul ve burayi degistir.
fabric_version=0.116.4+1.21.11
