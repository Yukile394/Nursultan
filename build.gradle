// build.gradle, Gradle 8.14.2, Fabric Loom 1.13.3, Minecraft 1.21.11, Java 21
plugins {
    // MC 1.21.11 unpick V3 formati kullaniyor, bunu sadece Loom 1.13+ destekliyor
    // (1.9/1.10'da "UnsupportedOperationException: Unsupported unpick version" patlar).
    // 1.21.11 ayni zamanda Loom'un "obfuscated" olarak isaretledigi SON surum -
    // bu yuzden hala legacy "fabric-loom" plugin id'si gecerli (yeni surumler
    // non-obfuscated MC icin "net.fabricmc.fabric-loom" / "fabric-loom-remap" ayrimina gidiyor,
    // 1.21.11 o ayrimdan once kaliyor).
    id "fabric-loom" version "1.13.3"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { name = "CaffeineMC"; url = "https://maven.caffeinemc.net/releases" }
    maven { name = "ViaVersion"; url = "https://repo.viaversion.com" }  // ViaLegacy/ViaBedrock/ViaLoader/MinecraftAuth burada da yayinlanir
    maven { name = "JitPack"; url = "https://jitpack.io" }
    exclusiveContent {
        forRepository {
            maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
    mavenCentral()
    // NOT: repo.lenni0451.net DNS'te cozulmuyordu (GitHub Actions runner'indan erisilemiyor,
    // repo kapanmis ya da tasinmis olabilir) - kaldirildi. Lenni0451 kutuphaneleri (Reflect,
    // Commons) asagida mavenCentral/jitpack'ten cozulmeye calisiliyor, orda da yoksa
    // libs/net_lenni0451_reflect.jar / libs/net_lenni0451_commons.jar dosyalarini
    // dogrudan jar'a gom (asagidaki jar{} blogundaki yorum).
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"  // dogrulandi, maven.fabricmc.net'te gercek

    // --- jar icinde gomulu bulunan ucuncu parti kutuphaneler ---
    // asagidaki surumler jar MANIFEST/mod.json icinde gecmiyordu, TAHMIN.
    // build.yml "Hata ozeti" ClassNotFoundException / cannot find symbol verirse
    // ilgili satirin surumunu degistir. libs/ altindaki ayristirilmis jar'lar
    // (decompile.py tarafindan uretilir) sadece referans/karsilastirma icindir,
    // burada dependency olarak KULLANILMAZ.

    // Sodium/Lithium/Iris - modrinth PROJE id'leri dogrulandi (AANobbMI/gvQqBUqZ/YL57xq9U),
    // VERSION id'leri decompile.py tarafindan her bootstrap'ta gradle.properties'e
    // otomatik yazilir (MC 1.21.11 icin Modrinth API'den taze cekilir).
    if (project.hasProperty("sodium_modrinth_version") && project.sodium_modrinth_version) {
        modImplementation "maven.modrinth:AANobbMI:${project.sodium_modrinth_version}"
    }
    if (project.hasProperty("lithium_modrinth_version") && project.lithium_modrinth_version) {
        modImplementation "maven.modrinth:gvQqBUqZ:${project.lithium_modrinth_version}"
    }
    if (project.hasProperty("iris_modrinth_version") && project.iris_modrinth_version) {
        modImplementation "maven.modrinth:YL57xq9U:${project.iris_modrinth_version}"
    }

    // Lenni0451 kutuphaneleri (reflect, commons) - ViaProxy ekosisteminin parcasi
    implementation "net.lenni0451:Reflect:1.4.0"  // TAHMIN - mavenCentral'da yoksa libs/net_lenni0451_reflect.jar kullan
    implementation "net.lenni0451.commons:httpclient:1.7.0"  // dogrulandi, Maven Central (artifact adi "httpclient", "commons-httpclient" DEGIL)

    // RaphiMC protokol koprusu kutuphaneleri - net.raphimc grubu resmi olarak Maven Central'da
    // yayinlaniyor (mvnrepository.com/artifact/net.raphimc), jitpack SNAPSHOT'a gerek yok.
    implementation "net.raphimc:ViaLegacy:3.0.16"  // dogrulandi, Maven Central
    // ViaBedrock: bagimsiz bir maven koordinati dogrulanamadi (ViaProxy'nin icine
    // gomulu olarak dagitiliyor olabilir, ayri yayinlanmiyor). libs/ altindaki ayristirilmis
    // jar'i dogrudan dosya bagimliligi olarak ekliyoruz - hem derlemede gorunur hem
    // asagidaki jar{} blogunda jar'a gomulur.
    implementation files("libs/net_raphimc_viabedrock.jar")
    implementation "net.raphimc:MinecraftAuth:5.0.1"  // dogrulandi, Maven Central

    // oshi (sistem bilgisi)
    implementation "com.github.oshi:oshi-core:6.6.5"  // TAHMIN

    // Kotlin stdlib - jar icinde SADECE kotlin/jvm/internal/Intrinsics.class (1 dosya)
    // bulundu, yani kendi kod Kotlin'le derlenmemis, sadece bu null-check yardimcisina
    // bagimli (muhtemelen baska bir kutuphane tarafindan cekiliyor). Tam stdlib yerine
    // tek class'i dogrudan dosya bagimliligi olarak ekliyoruz - hem derlemede gorunur
    // hem jar'a gomulur, tam stdlib cekmeye gerek yok:
    implementation files("libs/kotlin_jvm.jar")

    // Baritone - jitpack'teki resmi jar, MC 1.21.11 icin HENUZ fabric tag'i yok
    // (jitpack.io/p/cabaletta/baritone listesinde en yeni "1.21.3 Fabric"). Bu satir
    // suanda COZULMEYECEK - jar'daki baritone/ paketi (445 giris, libs/baritone.jar'da
    // duruyor) muhtemelen Nursultan Team'in kendi fork/branch'inden. Gercek kaynagi
    // (hangi fork, hangi commit) bulup build.gradle'i ona gore guncelle, ya da
    // asagidaki jar{} blogundaki from(zipTree("libs/baritone.jar")) satirini ac.
    // implementation "com.github.cabaletta:baritone:1.21.3-fabric-SNAPSHOT"  // yanlis MC surumu, KULLANMA
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // libs/ altindaki gomulu kutuphaneleri derleme-zamani stub olarak degil,
    // gercek bagimlilik olarak cozdugumuz icin burada ayrica embed etmiyoruz.
    // kotlin_jvm.jar ve net_raphimc_viabedrock.jar artik "implementation files(...)" ile
    // dependencies{} blogunda ekleniyor - Gradle/Loom bunlari otomatik olarak jar'a da
    // dahil eder, burada ayrica from(zipTree(...)) gerekmiyor.
    // Baritone icin gercek kaynak/surum bulunursa ayni yontemle (implementation files(...)):
    // implementation files("libs/baritone.jar")
}
