name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo'yu cek
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle wrapper var mi
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew yok. Once Bootstrap workflow'unu calistir."
            exit 1
          fi
          chmod +x gradlew

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Derle
        id: gradle_build
        run: |
          set +e
          ./gradlew build --no-daemon 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Hata ozeti
        if: steps.gradle_build.outputs.status != '0'
        run: |
          python3 - <<'PYEOF'
          import re
          from collections import Counter

          with open('/tmp/build.log', encoding='utf-8', errors='replace') as f:
              lines = [l.rstrip('\n') for l in f]

          pat = re.compile(r'^(?:/.*?src/main/java/)?(.+\.java):(\d+): error: (.+)$')
          errs = []
          for i, l in enumerate(lines):
              m = pat.match(l.strip())
              if not m:
                  continue
              path, ln, msg = m.groups()
              ctx = lines[i + 1:i + 6]
              code = ctx[0].strip() if ctx else ''
              sym = ''
              for c in ctx:
                  if c.strip().startswith('symbol:'):
                      sym = c.strip()[7:].strip()
                      break
              errs.append((path, ln, msg, code, sym))

          print('=' * 60)
          print(f'TOPLAM {len(errs)} hata')
          print('=' * 60)

          types = Counter(e[2].split(':')[0].strip()[:70] for e in errs)
          print('\nHATA TURLERI:')
          for k, v in types.most_common(15):
              print(f'  [{v}x] {k}')

          syms = Counter(e[4][:90] for e in errs if e[4])
          print('\nEKSIK SEMBOLLER (cannot find symbol), ilk 40:')
          for k, v in syms.most_common(40):
              print(f'  [{v}x] {k}')

          files = Counter(e[0] for e in errs)
          print('\nEN COK HATALI DOSYALAR, ilk 15:')
          for k, v in files.most_common(15):
              print(f'  [{v}x] {k}')

          print('\nORNEKLER (her turden 1):')
          seen = set()
          for path, ln, msg, code, sym in errs:
              key = msg.split(':')[0].strip()[:70]
              if key in seen or len(seen) >= 12:
                  continue
              seen.add(key)
              print(f'\n{path}:{ln}\n  {msg[:150]}\n  {code[:150]}')
          print('\n' + '=' * 60)
          PYEOF
          exit 1

      - name: Build basarisizsa durdur
        if: steps.gradle_build.outputs.status != '0'
        run: exit 1

      - name: Jar'i bul
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::build/libs altinda jar bulunamadi"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Artifacts'a yukle
        uses: actions/upload-artifact@v4
        with:
          name: nursultan-build
          path: ${{ steps.find_jar.outputs.jar_path }}

      - name: Surumu oku
        id: version
        run: |
          VERSION=$(grep -m1 '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release olustur
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Nursultan ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.find_jar.outputs.jar_path }}
          generate_release_notes: true
